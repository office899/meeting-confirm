<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>אישור הגעה לפגישה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e10; --surface: #18181b; --border: #2e2e34;
    --accent: #c9a96e; --text: #f0ede8; --muted: #8a8790;
    --success: #4caf81; --danger: #e05c5c;
    --font: 'Heebo', sans-serif;
  }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 2rem 1rem;
  }
  .wrap { max-width: 480px; width: 100%; animation: fadeUp 0.6s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .logo { text-align: center; margin-bottom: 2rem; }
  .logo-diamonds { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px; }
  .diamond { width: 7px; height: 7px; background: var(--accent); transform: rotate(45deg); }
  .logo h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.08em; color: var(--accent); }
  .logo p { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; margin-top: 2px; }
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; padding: 2rem; }
  .meeting-label { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
  .meeting-name { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 1.2rem; line-height: 1.3; }
  .details { display: flex; flex-direction: column; gap: 10px; }
  .detail-row { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--muted); }
  .detail-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .divider { height: 0.5px; background: var(--border); margin: 1.5rem 0; }
  .question { font-size: 16px; font-weight: 500; color: var(--text); text-align: center; margin-bottom: 1.2rem; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { padding: 14px; border-radius: 10px; border: 0.5px solid var(--border); font-size: 15px; font-weight: 600; font-family: var(--font); cursor: pointer; transition: all 0.18s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-yes { background: rgba(76,175,129,0.12); border-color: var(--success); color: var(--success); }
  .btn-yes:hover { background: rgba(76,175,129,0.22); transform: translateY(-2px); }
  .btn-no { background: rgba(224,92,92,0.10); border-color: var(--danger); color: var(--danger); }
  .btn-no:hover { background: rgba(224,92,92,0.20); transform: translateY(-2px); }
  .result { display: none; text-align: center; padding: 1rem 0; animation: fadeUp 0.4s ease both; }
  .result.visible { display: block; }
  .result-icon { font-size: 52px; margin-bottom: 1rem; }
  .result-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .result-sub { font-size: 14px; color: var(--muted); line-height: 1.6; white-space: pre-line; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-diamonds">
      <div class="diamond"></div>
      <h1 id="dj-name">טוען...</h1>
      <div class="diamond"></div>
    </div>
    <p id="dj-sub">אישור הגעה לפגישה</p>
  </div>
  <div class="card">
    <div id="main-content">
      <div class="meeting-label">פרטי הפגישה</div>
      <div class="meeting-name" id="meeting-name">טוען...</div>
      <div class="details">
        <div class="detail-row"><span class="detail-icon">📅</span><span id="meeting-date">—</span></div>
        <div class="detail-row"><span class="detail-icon">🕐</span><span id="meeting-time">—</span></div>
        <div class="detail-row"><span class="detail-icon">📍</span><span>הנציב 29 א', תל אביב, בית רוזליה. קומה 5</span></div>
      </div>
      <div class="divider"></div>
      <div class="question">האם תגיעו לפגישה?</div>
      <div class="btn-row">
        <button class="btn btn-yes" onclick="respond('yes')">✅ כן, מגיעים</button>
        <button class="btn btn-no"  onclick="respond('no')">❌ לא מגיעים</button>
      </div>
    </div>
    <div class="result" id="result">
      <div class="result-icon" id="result-icon"></div>
      <div class="result-title" id="result-title"></div>
      <div class="result-sub" id="result-sub"></div>
    </div>
  </div>
</div>
<script>
  const WEBHOOK = 'https://hook.eu1.make.com/49389jkd660pf50kxgkerp55rotwtbia';

  const params = new URLSearchParams(window.location.search);
  const couple = params.get('couple') || 'האורחים';
  const date   = params.get('date')   || '';
  const time   = params.get('time')   || '';
  const type   = params.get('type')   || 'פגישה';
  const dj     = params.get('dj')     || '';

  document.getElementById('meeting-name').textContent = couple;
  document.getElementById('meeting-date').textContent = date || 'תאריך לא צוין';
  document.getElementById('meeting-time').textContent = time || 'שעה לא צוינה';

  const djMap = {
    'עומר': { full: 'עומר כחלון',  sub: 'DJ & אירועים' },
    'מתן':  { full: 'מתן דינו',    sub: 'DJ & אירועים' },
    'שלו':  { full: 'שלו וזאנה',   sub: 'DJ & אירועים' },
    'אופק': { full: 'אופק אדטו',   sub: 'DJ & אירועים' },
  };
  const djInfo = djMap[dj] || { full: dj || 'DJ & אירועים', sub: 'אישור הגעה לפגישה' };
  document.getElementById('dj-name').textContent = djInfo.full;
  document.getElementById('dj-sub').textContent  = djInfo.sub;

  function respond(answer) {
    document.getElementById('main-content').style.display = 'none';
    const resultEl = document.getElementById('result');
    if (answer === 'yes') {
      document.getElementById('result-icon').textContent  = '🎉';
      document.getElementById('result-title').textContent = 'תודה! אישרת הגעה';
      document.getElementById('result-sub').textContent   = 'נשמח לראותך בפגישה.\nנתראה בקרוב! 🎵\n\n' + djInfo.full;
    } else {
      document.getElementById('result-icon').textContent  = '😔';
      document.getElementById('result-title').textContent = 'תודה על העדכון';
      document.getElementById('result-sub').textContent   = 'קיבלנו את הביטול.\n' + djInfo.full + ' ייצור איתך קשר לתיאום מועד חדש.';
    }
    resultEl.classList.add('visible');
    const p = new URLSearchParams({ couple, date, time, type, dj: djInfo.full, answer });
    new Image().src = WEBHOOK + '?' + p.toString();
  }
</script>
</body>
</html>
